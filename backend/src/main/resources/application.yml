server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: gmail-reader-backend
  
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gmail_reader?sslMode=REQUIRED&useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Static resources (Next.js build)
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        period: 3600
      chain:
        enabled: true
        compressed: true

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/api/auth/callback}
  
  gmail:
    scopes:
      - "https://www.googleapis.com/auth/gmail.readonly"
      - "https://www.googleapis.com/auth/userinfo.email"
      - "https://www.googleapis.com/auth/userinfo.profile"

jwt:
  secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production-min-256-bits}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

app:
  frontend-url: ${FRONTEND_URL:http://localhost:8080}
  sync:
    batch-size: 50
    max-emails-per-sync: 500
  
  ai:
    enabled: true
    provider: groq
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.1-8b-instant}
      base-url: https://api.groq.com/openai/v1
    max-tokens: 2000
    temperature: 0.1

logging:
  level:
    com.gmailreader: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized